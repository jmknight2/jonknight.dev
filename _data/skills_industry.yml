- title: SAML SSO
  desc: "As the admin of an organization that heavily utilizes Azure Active Directory for SSO, I've the opportunity to learn a lot about SAML and it's various features. I've configured and maintained 30+ SAML applications, each with their own unique features. I've also integrated SAML into my own internal applications, utilizing true claims-based RBAC."
  img: "/assets/images/SAML_Logo.png"
  index: 3

- title: Active Directory
  desc: "I've spent over 4 years working with Active Directory, and I've done everything from building custom front-ends to manage users, to writing scripts to automate user creation. I've also built custom reports, and even built a custom password reset portal for our users. I've deployed new domain controllers, and managed domains as large as 30,000+ users."
  img: "/assets/images/ActiveDirectory_Logo.png"
